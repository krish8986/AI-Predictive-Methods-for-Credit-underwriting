# version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api

    container_name: credit-api

    env_file:
      - .env

    ports:
      - "8001:8000"

    volumes:
      - .:/app

    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit

    container_name: credit-dashboard

    depends_on:
      - api

    environment:
      API_BASE_URL: http://api:8000

    ports:
      - "8501:8501"

    volumes:
      - .:/app

    restart: unless-stopped
